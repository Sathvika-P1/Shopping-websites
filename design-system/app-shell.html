<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping Web — App shell</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="prototype-utils.css">
<style>
  .shell { min-height: 100vh; display: flex; flex-direction: column; }
  .shell-header { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-bottom: var(--border-width) solid var(--color-border); background: var(--color-bg); }
  .shell-brand { font-family: var(--font-serif); font-size: var(--font-size-lg); letter-spacing: var(--letter-spacing-wide); text-transform: uppercase; color: var(--color-fg); text-decoration: none; margin-right: auto; }
  .shell-nav { display: none; flex-direction: column; gap: var(--space-1); width: 100%; order: 3; }
  .shell-nav.is-open { display: flex; }
  .shell-nav a { display: block; padding: var(--space-2) var(--space-3); color: var(--color-fg); text-decoration: none; border-radius: var(--radius-md); }
  .shell-nav a:hover { background: var(--color-bg-subtle); }
  .shell-nav a[aria-current="page"] { color: var(--color-primary); font-weight: var(--font-weight-bold); }
  .shell-nav a:focus-visible, .shell-brand:focus-visible, .shell-actions a:focus-visible { outline: var(--focus-ring-width) solid var(--color-primary); outline-offset: calc(var(--focus-ring-width) * -1); }
  .shell-actions { display: flex; align-items: center; gap: var(--space-1); }
  .shell-brand, .shell-actions a, .shell-nav a { display: inline-flex; align-items: center; justify-content: center; padding: var(--space-3) var(--space-2); min-height: var(--tap-target-min, 44px); min-width: var(--tap-target-min, 44px); box-sizing: border-box; }
  .shell-menu-btn { min-height: var(--tap-target-min, 44px); min-width: var(--tap-target-min, 44px); }
  .shell-nav a { display: flex; justify-content: flex-start; padding: var(--space-3); }
  .shell-actions a { color: var(--color-fg); text-decoration: none; border-radius: var(--radius-md); }
  .shell-actions a:hover { background: var(--color-bg-subtle); }
  .shell-actions a[aria-current="page"] { color: var(--color-primary); font-weight: var(--font-weight-bold); }
  .shell-main { flex: 1; width: 100%; max-width: var(--container-max); margin-inline: auto; padding: var(--space-4) var(--space-3); }
  .shell-footer { padding: var(--space-4) var(--space-3); border-top: var(--border-width) solid var(--color-border); background: var(--color-bg-subtle); color: var(--color-fg-muted); font-size: var(--font-size-sm); }
  .shell-footer a { display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap-target-min, 44px); min-width: var(--tap-target-min, 44px); color: var(--color-fg-muted); }
  @media (min-width: 768px) {
    .shell-header { flex-wrap: nowrap; padding-inline: var(--space-4); gap: var(--space-4); }
    .shell-brand { margin-right: 0; }
    .shell-nav { display: flex; flex-direction: row; width: auto; order: 0; margin-right: auto; }
    .shell-menu-btn { display: none; }
  }
</style>
</head>
<body>
<div class="shell" data-arc-shell>
  <header class="shell-header" data-arc-shell-part="header">
    <a class="shell-brand" href="#">Shopping Web</a>
    <div class="shell-actions">
      <a href="#" data-nav-key="wishlist">Wishlist</a>
      <a href="#" data-nav-key="account">Account</a>
      <a href="#" data-nav-key="bag">Bag</a>
      <button class="btn btn-secondary btn-sm shell-menu-btn" type="button" data-toggle="main-nav" aria-controls="main-nav" aria-label="Menu">Menu</button>
    </div>
    <nav class="shell-nav" id="main-nav" aria-label="Main" data-arc-shell-part="nav">
      <a href="#" data-nav-key="shop">Shop</a>
      <a href="#" data-nav-key="categories">Categories</a>
      <a href="#" data-nav-key="deals">Deals</a>
    </nav>
  </header>
  <main class="shell-main" data-arc-content></main>
  <footer class="shell-footer" data-arc-shell-part="footer">
    <nav class="cluster cluster-lg" aria-label="Footer">
      <a href="#">Help</a>
      <a href="#">Shipping and returns</a>
      <a href="#">Privacy</a>
    </nav>
    <p>© Shopping Web</p>
  </footer>
</div>
</body>
</html>
